name: Build Diagnostic

# 白屏定位专用：构建一个只渲染 Hello World、并逐项检测原生模块的最小工程。
# 用它区分"构建/环境问题"与"业务代码问题"。
on:
  workflow_dispatch:

jobs:
  build:
    name: 构建诊断 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不用 android-actions/setup-android：它会连带安装 Android Emulator，
      # 下载中断即报 "Error on ZipFile unknown archive"，构建根本用不到模拟器
      - name: 准备 Android SDK
        timeout-minutes: 10
        run: bash scripts/setup-android-sdk.sh

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 补齐依赖到匹配版本
        working-directory: apps/diagnostic
        run: |
          npx expo install \
            expo-secure-store \
            expo-sqlite \
            react-native-quick-crypto \
            react-native-keychain \
            react-native-quick-base64 \
            expo-file-system \
            react-native-paper \
            react-native-vector-icons \
            react-native-safe-area-context \
            react-native-screens \
            expo-build-properties

      # Gradle 报 "path may not be null or empty string" 的真因是入口解析失败，
      # 但错误信息完全看不出来。这里先查一次，秒级失败。
      - name: 校验入口文件可解析
        run: node scripts/check-entry.mjs apps/diagnostic

      # Metro 在打包期静态解析 require() 字面量，try/catch 挡不住模块不存在。
      # 在构建前扫一遍，避免等四分钟 Gradle 才发现。
      - name: 校验模块引用可解析
        run: node scripts/check-requires.mjs apps/diagnostic

      - name: 生成原生工程
        working-directory: apps/diagnostic
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: 确认 Kotlin 版本已注入
        working-directory: apps/diagnostic
        run: |
          if ! grep -q '^android.kotlinVersion=1.9.25$' android/gradle.properties; then
            echo "Kotlin 版本未注入"; cat android/gradle.properties; exit 1
          fi
          echo "Kotlin OK"

      # 默认堆上限不够，会在跑十几分钟后的依赖收集阶段抛 Java heap space
      - name: 配置 Gradle 内存
        run: |
          free -h || true
          bash scripts/gradle-memory.sh apps/diagnostic

      # 必须走 release 变体，否则 JS bundle 不进 APK，一样白屏
      - name: 构建自包含 APK
        timeout-minutes: 45
        working-directory: apps/diagnostic/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 校验 JS bundle 已内置
        working-directory: apps/diagnostic/android/app/build/outputs/apk/release
        run: |
          APK=$(find . -name "*.apk" | head -1)
          unzip -l "$APK" | grep -q "assets/index.android.bundle" \
            && echo "已内置 JS bundle" \
            || { echo "缺少 JS bundle"; exit 1; }

      - name: 上传诊断 APK
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-apk
          path: apps/diagnostic/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
