name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        default: standalone
        type: choice
        # standalone：自带 JS bundle，装到手机就能跑（推荐）
        # debug：开发构建，不打包 JS，必须连 Metro 才能用
        # release：上架用 AAB，需要签名密钥
        options: [standalone, debug, release]
  push:
    tags: ['v*']

jobs:
  build:
    name: 构建 Android APK / AAB
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://localhost:8787' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不用 android-actions/setup-android：它会连带安装 Android Emulator，
      # 下载中断即报 "Error on ZipFile unknown archive"，构建根本用不到模拟器
      - name: 准备 Android SDK
        timeout-minutes: 10
        run: bash scripts/setup-android-sdk.sh

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      # expo-router 只是个壳，安全区/原生屏幕/深链/常量/状态栏都是它的 peer 依赖。
      # 少装任何一个，都要等到 3 分钟后的 createBundleReleaseJsAndAssets 才暴露。
      # 用 expo install 而不是 npm install：它会按当前 SDK 挑选匹配版本，避免手写版本号漂移。
      - name: 安装 Expo Router 配套依赖
        working-directory: apps/mobile
        run: |
          npx expo install \
            expo-router \
            react-native-safe-area-context \
            react-native-screens \
            react-native-paper \
            react-native-vector-icons \
            expo-file-system \
            expo-linking \
            expo-constants \
            expo-status-bar

      # 秒级失败：确认这些包真的落在 node_modules 里
      - name: 校验 Expo Router 依赖齐备
        run: |
          missing=0
          for pkg in react-native-safe-area-context react-native-screens react-native-paper react-native-vector-icons expo-linking expo-constants expo-status-bar expo-router; do
            if [ -d "node_modules/$pkg" ]; then
              echo "OK $pkg $(node -p "require('./node_modules/$pkg/package.json').version" 2>/dev/null)"
            else
              echo "MISSING $pkg"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "expo-router 的 peer 依赖缺失，打包必然失败"; exit 1
          fi

      - name: 校验入口文件可解析
        run: node scripts/check-entry.mjs apps/mobile

      - name: 生成原生工程
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      # 先确认 expo-build-properties 真的把 Kotlin 版本写进了 gradle.properties
      # 否则 Gradle 会在几分钟后以 Compose/Kotlin 版本不匹配失败，白跑一趟
      - name: 确认 Kotlin 版本已注入
        working-directory: apps/mobile
        run: |
          if ! grep -q '^android.kotlinVersion=1.9.25$' android/gradle.properties; then
            echo "android/gradle.properties 中未找到 android.kotlinVersion=1.9.25"
            cat android/gradle.properties
            exit 1
          fi
          echo "Kotlin 版本已注入：$(grep '^android.kotlinVersion' android/gradle.properties)"

      - name: 配置 Gradle 内存
        run: |
          free -h || true
          bash scripts/gradle-memory.sh apps/mobile

      # 自包含 APK：assembleRelease 会把 JS bundle 打进 APK。
      # Expo 模板默认让 release 复用 debug 签名，所以无需密钥即可产出可安装的 APK。
      - name: 构建自包含 APK（推荐）
        if: ${{ github.event.inputs.build_type == 'standalone' }}
        timeout-minutes: 45
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # 只有这个类型需要 Metro：装到手机后要 `npx expo start --dev-client` 并扫码
      - name: 构建开发调试 APK（需连接 Metro）
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 构建上架用 AAB（需签名密钥）
        timeout-minutes: 45
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ../e2ee-release.jks
            cat >> app/build.gradle <<'GRADLE'

          // 由 CI 注入的发布签名配置
          android {
              signingConfigs {
                  release {
                      storeFile file("../../e2ee-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes.release.signingConfig signingConfigs.release
          }
          GRADLE
          fi
          ./gradlew bundleRelease --no-daemon

      # 关键防线：debug 构建不含 JS bundle，装到真机必然红屏 "Unable to load script"
      # 这里在上传前就检查出来，避免用户下载一个打不开的 APK
      - name: 校验 APK 是否内置 JS bundle
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: apps/mobile/android/app/build/outputs/apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "未找到 APK"; exit 1; fi
          echo "检查产物：$APK"
          if unzip -l "$APK" | grep -q "assets/index.android.bundle"; then
            echo "已内置 JS bundle，可以直接安装到手机"
          else
            echo "APK 内没有 assets/index.android.bundle"
            echo "这个包装到手机会红屏 'Unable to load script'"
            if [ "${{ github.event.inputs.build_type }}" = "standalone" ]; then
              echo "standalone 类型本应内置 bundle，构建配置有问题"; exit 1
            fi
            echo "debug 类型属预期，请配合 Metro 使用：npx expo start --dev-client"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.build_type || 'release' }}
          path: |
            apps/mobile/android/app/build/outputs/apk/**/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
